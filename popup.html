<!DOCTYPE html>
<html>
<head>
  <title>Bookmark Wizard</title>
  <style>
    body {
      width: 600px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .bookmark-list {
      max-height: 500px;
      overflow-y: auto;
    }
    .bookmark-item {
      border: 1px solid #ddd;
      margin: 10px 0;
      padding: 15px;
      border-radius: 5px;
      background: #f9f9f9;
    }
    .bookmark-id {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    .bookmark-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #2c3e50;
    }
    .bookmark-url {
      color: #3498db;
      text-decoration: none;
      word-break: break-all;
      font-size: 14px;
    }
    .bookmark-description {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }
    .timestamp {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 8px 15px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .refresh-btn {
      background: #3498db;
    }
    .refresh-btn:hover {
      background: #2980b9;
    }
    .fetch-btn {
      background: #2ecc71;
    }
    .fetch-btn:hover {
      background: #27ae60;
    }
    .no-bookmarks {
      text-align: center;
      color: #666;
      padding: 20px;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Bookmark Wizard</h2>
    <div class="button-group">
      <button class="btn fetch-btn" id="fetchBtn">Fetch Bookmarks</button>
      <button class="btn refresh-btn" id="refreshBtn">Refresh</button>
    </div>
  </div>
  <div id="status" class="status"></div>
  <div id="bookmarkList" class="bookmark-list">
    <div class="no-bookmarks">No bookmarks found</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
