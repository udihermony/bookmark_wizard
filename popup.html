<!DOCTYPE html>
<html>
<head>
  <title>Bookmark Wizard</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357abd;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    #debugSection {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      display: none;
    }
    #debugContent {
      font-family: monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
      background-color: #f8f9fa;
      border-radius: 4px;
    }
    .debug-title {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Bookmark Wizard</h2>
  <button id="analyzeBtn">Analyze Bookmarks</button>
  <button id="organizeBtn" disabled>Organize Bookmarks</button>
  <div id="status"></div>
  <div id="debugSection">
    <div class="debug-title"></div>
    <div id="debugContent"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
